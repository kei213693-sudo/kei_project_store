
// 1: ROM
// 2: RAM
FUNC void remap (int m) 
{
    _WDWORD(0x400e003c, _RDWORD(0x400e003c) | (1<<5));
    _WDWORD(0x400e003c, (_RDWORD(0x400e003c) & 0xfffffff0) | m | (1<<5));
}

// Power on all SRAM
_WDWORD(0x400e0010, 0x000FFFFF);
_WDWORD(0x40001050, 0);
_WDWORD(0x4000100C, 1);

// Remap and load code
remap(2);
LOAD ..\..\..\lib\misc\stack_data_a1.hex INCREMENTAL
LOAD %L
LOAD ..\..\..\..\..\tags\hs6621_rom_a1_release\rom\release\hs6621_rom.axf INCREMENTAL NOCODE

// Disable All IRQ
_WDWORD(0xE000E180, 0xFFFFFFFF)
_WDWORD(0xE000E184, 0xFFFFFFFF)

// Button
KILL BUTTON *
DEFINE BUTTON "Reset-Reload", "RESET; LOAD ..\\..\\..\\lib\\misc\\stack_data_a1.hex INCREMENTAL; LOAD %L INCREMENTAL"
